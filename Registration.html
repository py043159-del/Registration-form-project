<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>
    body{

        background-image: url('./image.png');
        background-repeat: no-repeat;
        background-size: cover;

    }
    * {
        margin: 0;
        padding: 0;
    }

    .container {
        background-color: rgba(85, 82, 78, 0.2);
        width: 25%;
        margin: auto;
        border-radius: 5px;
        padding: 10px 0 10px 10px;
        box-shadow: 3px 3px 3px rosybrown;
        height: 350px;
        text-align: center;
        color: white;
        backdrop-filter: blur(10px);
        margin-top: 10%;
        border: 1px solid gray;
    }

    .input {
        width: 70%;
        padding: 5px;
        border: 0;
        background-color: white;
        border-radius: 5px;
        text-align: left;
        font-size: 10px;
    }

    .name {
        width: 40%;
        position: relative;
        color: black;
    }

    .name input {
        width: 200%;
        padding: 8px;
        padding-left: 40px;
        border: 0;
        box-shadow: 0 0 2px gray;
        border-radius: 3px;
        margin: 5px;
    }

    .name i {
        position: absolute;
        top: 8px;
        left: 10px;
    }

    .mail {
        width: 40%;
        position: relative;
        color: black;
    }

    .mail input {
        width: 200%;
        padding: 8px;
        padding-left: 40px;
        border: 0;
        box-shadow: 0 0 2px gray;
        border-radius: 3px;
        margin: 5px;
    }

    .mail i {
        position: absolute;
        top: 8px;
        left: 10px;

    }

    .num {
        width: 40%;
        position: relative;
        color: black;
    }

    .num input {
        width: 200%;
        padding: 8px;
        padding-left: 40px;
        border: 0;
        box-shadow: 0 0 2px gray;
        border-radius: 3px;
        margin: 5px;
    }

    .num i {
        position: absolute;
        top: 8px;
        left: 10px;
    }

    .sel {
        width: 40%;
        position: relative;
        color: black;
    }

    .sel input {
        width: 200%;
        padding: 8px;
        padding-left: 40px;
        border: 0;
        box-shadow: 0 0 2px gray;
        border-radius: 3px;
        margin: 5px;
    }

    .sel i {
        position: absolute;
        top: 8px;
        left: 10px;
    }

    .lock {
        width: 40%;
        position: relative;
        color: black;
    }

    .lock input {
        width: 200%;
        padding: 8px;
        padding-left: 40px;
        border: 0;
        box-shadow: 0 0 2px gray;
        border-radius: 3px;
        margin: 5px;
    }

    .lock i {
        position: absolute;
        top: 8px;
        left: 10px;
    }

    .regi {
        width: 40%;
        position: relative;
    }

    .regi input {
        width: 200%;
        padding: 8px;
        padding-left: 40px;
        border: 0;
        box-shadow: 0 0 2px gray;
        border-radius: 3px;
        margin: 5px;
    }

    .regi button {
       width: 240%;
       padding: 8px;
       text-align: center; 

        
    }
    .ac{
        text-align: center;
    }
</style>

<body>
    <div class="container">
        <h1><i class="fa fa-user-plus">Register Now</i></h1>
        <br>
        <div class="name">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="Enter your full name">
        </div>
        <div class="mail">
            <i class="fa fa-envelope"></i>
            <input type="text" placeholder="Enter your email">
        </div>
        <div class="num">
            <i class="fa fa-phone"></i>
            <input type="text" placeholder="Enter mobile number">
        </div>
        <div class="sel">
            <input type="text" placeholder="Select Course">
            <i class="fa fa-angle-down"></i>
        </div>
        <div class="lock">
            <i class="fa fa-lock"></i>
            <input type="text" placeholder="Create password">
        </div>
        <div class="regi">
           <button><i class="fa fa-paper-plane"></i>Register</button>
        </div>
        <div class="ac">
            <i class="ac">Already have an account?Login</i>


        </div>
    </div>

</body>

</html>
